<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Quality Evaluation - Zzoomm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        :root {
            --primary: #e6007e;
            --primary-gradient: linear-gradient(135deg, #e6007e 0%, #ff1a8c 100%);
            --dark: #0f172a;
            --light: #f8fafc;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
        body { background: var(--light); color: var(--text-main); padding: 2rem 1.5rem; }
        .form-card { max-width: 650px; margin: 0 auto; background: var(--card-bg); padding: 2rem; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        h2 { font-size: 1.35rem; font-weight: 800; margin-bottom: 0.25rem; color: var(--text-main); }
        .sub { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.5rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.35rem; margin-bottom: 1.1rem; }
        label { font-size: 0.75rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
        input, select, textarea { padding: 0.65rem 0.85rem; border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; font-family: inherit; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); }
        .btn-submit { background: var(--primary-gradient); color: white; border: none; padding: 0.85rem; border-radius: 8px; font-weight: 700; width: 100%; cursor: pointer; margin-top: 0.5rem; font-size: 0.95rem; transition: opacity 0.2s; }
        .btn-submit:hover { opacity: 0.95; }
    </style>
</head>
<body>

    <div class="form-card">
        <h2 id="formHeading">Submit Quality Evaluation</h2>
        <p class="sub">Fill out this evaluation. It will be sent to the agent's dashboard as Pending until acknowledged.</p>

        <form id="evaluationForm" onsubmit="handleEvaluationSubmit(event)">
            <div class="form-group">
                <label>Evaluation Type</label>
                <select id="qaStyle" required>
                    <option value="Call Listening Feedback">Call Listening Feedback</option>
                    <option value="Ticket Feedback">Ticket Feedback</option>
                </select>
            </div>

            <div class="form-group">
                <label>Agent Name</label>
                <select id="agentSelect" required></select>
            </div>

            <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                <div class="form-group" style="flex: 1; min-width: 200px;">
                    <label>Interaction Reference ID</label>
                    <input type="text" id="interactionRef" placeholder="e.g. Call #48102 or Ticket #9201" required>
                </div>
                <div class="form-group" style="flex: 1; min-width: 200px;">
                    <label>Score (%)</label>
                    <input type="number" id="qaScore" min="0" max="100" placeholder="e.g. 92" required>
                </div>
            </div>

            <div class="form-group">
                <label>Evaluation Date</label>
                <input type="date" id="evalDate" required>
            </div>

            <div class="form-group">
                <label>Evaluator Feedback & Coaching Notes</label>
                <textarea id="qaComments" rows="5" placeholder="Provide detailed coaching feedback, strengths, and areas for improvement..." required></textarea>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">Submit QA Form to Agent</button>
        </form>
    </div>

    <script>
        const client = window.supabaseClient || window.supabase;
        const activeUser = sessionStorage.getItem("activeUser") || "Supervisor";
        const urlParams = new URLSearchParams(window.location.search);
        const prefillType = urlParams.get('type');
        const prefillAgent = urlParams.get('agent');

        document.addEventListener("DOMContentLoaded", async () => {
            document.getElementById("evalDate").value = new Date().toISOString().split('T')[0];
            if (prefillType) document.getElementById("qaStyle").value = prefillType;

            await populateAgents();
        });

        async function populateAgents() {
            const select = document.getElementById("agentSelect");
            select.innerHTML = '<option value="">-- Choose Agent --</option>';

            if (!client) return;
            const { data, error } = await client.from('agent_stats').select('agent_name').order('agent_name');
            if (data) {
                data.forEach(row => {
                    const opt = document.createElement("option");
                    opt.value = row.agent_name;
                    opt.innerText = row.agent_name;
                    if (prefillAgent && prefillAgent.toLowerCase() === row.agent_name.toLowerCase()) {
                        opt.selected = true;
                    }
                    select.appendChild(opt);
                });
            }
        }

        async function handleEvaluationSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById("submitBtn");
            btn.disabled = true;
            btn.innerText = "Submitting to Agent...";

            const formPayload = {
                qa_style: document.getElementById("qaStyle").value,
                agent: document.getElementById("agentSelect").value,
                evaluator: activeUser,
                call_ref: document.getElementById("interactionRef").value.trim(),
                ticket_ref: document.getElementById("interactionRef").value.trim(),
                score: parseFloat(document.getElementById("qaScore").value),
                date: document.getElementById("evalDate").value,
                comments: document.getElementById("qaComments").value.trim(),
                status: "Pending",
                agent_acknowledged: false,
                agent_comments: null
            };

            const { data, error } = await client.from('feedback_docs').insert([formPayload]).select();

            if (!error) {
                alert("Evaluation logged! Sent to " + formPayload.agent + " for acknowledgment.");
                if (window.opener && !window.opener.closed) {
                    window.opener.location.reload();
                }
                window.close();
            } else {
                alert("Error submitting evaluation: " + error.message);
                btn.disabled = false;
                btn.innerText = "Submit QA Form to Agent";
            }
        }
    </script>
</body>
</html>
